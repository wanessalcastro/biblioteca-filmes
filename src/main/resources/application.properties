spring.application.name=biblioteca-filmes
server.port=${PORT:8080}

# ---- H2 em memória + console ----
spring.datasource.url=jdbc:h2:mem:bibliotecafilmes;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=create-drop
# data.sql roda depois que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ---- Paginação ----
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# ---- Swagger / OpenAPI ----
# /swagger-ui.html é uma página própria (static/swagger-ui.html) com tema azul;
# a interface padrão do springdoc continua em /swagger-ui-padrao.html
springdoc.swagger-ui.custom-css-url=/swagger-ui.css
springdoc.swagger-ui.path=/swagger-ui-padrao.html
springdoc.swagger-ui.doc-expansion=list
springdoc.api-docs.path=/v3/api-docs

# ================= PARTE 2 =================
# ---- CORS: origens (separadas por vírgula) que podem chamar a API pelo navegador ----
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Content-Type,Accept,X-API-Key,X-Idempotency-Key,X-API-Version
app.cors.max-age-seconds=3600

# ---- Rate limiting (por IP): no máximo N requisições a cada janela ----
app.rate-limit.requests=60
app.rate-limit.window-seconds=60

# ---- Idempotência: por quanto tempo a resposta de um POST fica guardada ----
app.idempotency.ttl-hours=24
server.port=${PORT:8080}
