<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Biblioteca de Filmes - Swagger UI</title>
    <link rel="stylesheet" href="/swagger-ui/swagger-ui.css">
    <link rel="stylesheet" href="/swagger-custom.css">
</head>
<body>
<header class="topo">
    <div class="topo-conteudo">
        <span class="topo-titulo">API Biblioteca de Filmes</span>
        <nav>
            <a class="topo-link" href="https://mit-license.org/" target="_blank" rel="noopener noreferrer">Licença MIT</a>
            <a class="topo-link" href="https://www.sp.senac.br/" target="_blank" rel="noopener noreferrer">Senac São Paulo</a>
        </nav>
    </div>
</header>

<div id="swagger-ui"></div>

<script src="/swagger-ui/swagger-ui-bundle.js"></script>
<script>
    window.onload = function () {
        window.ui = SwaggerUIBundle({
            url: "/v3/api-docs",
            dom_id: "#swagger-ui",
            presets: [SwaggerUIBundle.presets.apis],
            layout: "BaseLayout",
            docExpansion: "list",
            tagsSorter: "alpha",
            operationsSorter: "method",
            displayRequestDuration: true,
            tryItOutEnabled: true,
            persistAuthorization: true
        });
    };
</script>
</body>
</html>
